<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Taskly — Simple Task Manager</title>
  <meta name="description" content="A simple and responsive task management app built with HTML, CSS, and vanilla JavaScript.">

  <!-- Open Graph -->
  <meta property="og:title" content="Taskly — Simple Task Manager">
  <meta property="og:description" content="A simple and responsive task management app built with HTML, CSS, and vanilla JavaScript.">
  <meta property="og:type" content="website">

  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2222%22 fill=%22%2363b696%22/><path d=%22M28 52 L44 68 L74 34%22 stroke=%22%230c1a15%22 stroke-width=%229%22 fill=%22none%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22/></svg>">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">

  <!-- Set the saved theme before first paint to avoid a flash of the wrong theme -->
  <script>
    (function () {
      try {
        var savedTheme = localStorage.getItem("taskly:theme");
        var theme = savedTheme === "light" || savedTheme === "dark" ? savedTheme : "dark";
        document.documentElement.setAttribute("data-theme", theme);
      } catch (error) {
        document.documentElement.setAttribute("data-theme", "dark");
      }
    })();
  </script>
</head>
<body>

  <a class="skip-link" href="#main">Skip to content</a>

  <!-- ===== Header ===== -->
  <header class="app-header">
    <div class="app-header-inner">
      <div class="brand">
        <span class="brand-name">Taskly</span>
        <span class="brand-tagline">Plan less. Do more.</span>
      </div>

      <div class="header-actions">
        <button type="button" class="icon-btn" id="themeToggle" aria-pressed="false" aria-label="Switch to light mode">
          <!-- Sun / moon icons swap via CSS based on [data-theme] -->
          <svg class="icon icon-sun" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <circle cx="12" cy="12" r="4.5" stroke="currentColor" stroke-width="1.6"/>
            <path d="M12 2.5v2.2M12 19.3v2.2M4.2 4.2l1.55 1.55M18.25 18.25l1.55 1.55M2.5 12h2.2M19.3 12h2.2M4.2 19.8l1.55-1.55M18.25 5.75l1.55-1.55" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
          </svg>
          <svg class="icon icon-moon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
          </svg>
        </button>

        <!-- TODO: replace with your real GitHub repo link -->
        <a href="https://github.com/glkrynwan/taskly-todo-app" target="_blank" rel="noopener noreferrer" class="icon-btn" aria-label="View source on GitHub">
          <svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/></svg>
        </a>
      </div>
    </div>
  </header>

  <main id="main" class="app-main">
    <div class="app-container">

      <!-- ===== Greeting ===== -->
      <section class="greeting" aria-label="Greeting">
        <div id="greetingHeader" class="greeting-header" aria-live="polite"><!-- filled by script.js --></div>
        <p class="greeting-subtitle">What needs to get done?</p>
      </section>

      <!-- ===== Add Task ===== -->
      <section class="add-task-section" aria-label="Add a new task">
        <form id="addTaskForm" class="add-task-form" novalidate>
          <label for="taskInput" class="sr-only">New task</label>
          <input
            type="text"
            id="taskInput"
            name="task"
            class="task-input"
            placeholder="What needs to get done?"
            autocomplete="off"
            maxlength="200"
          >
          <button type="submit" class="btn btn-primary add-task-btn" aria-label="Add Task">
            <svg class="icon" viewBox="0 0 20 20" fill="none" aria-hidden="true">
              <path d="M10 4v12M4 10h12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
            </svg>
            <span class="btn-label">Add Task</span>
          </button>
        </form>
        <p id="taskInputMessage" class="input-message" role="alert" aria-live="assertive"></p>
      </section>

      <!-- ===== Toolbar: filters, search, sort ===== -->
      <section class="toolbar" aria-label="Task filters and search">
        <div class="filter-group" role="group" aria-label="Filter tasks">
          <button type="button" class="filter-btn" data-filter="all" aria-pressed="true">All</button>
          <button type="button" class="filter-btn" data-filter="active" aria-pressed="false">Active</button>
          <button type="button" class="filter-btn" data-filter="completed" aria-pressed="false">Completed</button>
        </div>

        <div class="toolbar-end">
          <div class="search-field">
            <label for="searchInput" class="sr-only">Search tasks</label>
            <svg class="icon search-icon" viewBox="0 0 20 20" fill="none" aria-hidden="true">
              <circle cx="9" cy="9" r="6" stroke="currentColor" stroke-width="1.6"/>
              <path d="M17 17l-3.5-3.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
            </svg>
            <input type="search" id="searchInput" class="search-input" placeholder="Search tasks...">
            <kbd class="shortcut-hint" aria-hidden="true"><span class="shortcut-key">Ctrl</span><span class="shortcut-key">K</span></kbd>
          </div>

          <div class="sort-field">
            <label for="sortSelect" class="sr-only">Sort by</label>
            <select id="sortSelect" class="sort-select">
              <option value="newest">Newest</option>
              <option value="oldest">Oldest</option>
              <option value="completed">Completed</option>
            </select>
          </div>
        </div>
      </section>

      <!-- ===== Task List ===== -->
      <section class="task-panel" aria-label="Tasks">
        <ul id="taskList" class="task-list"></ul>

        <!-- Empty states are shown/hidden by script.js -->
        <div id="emptyState" class="empty-state" hidden>
          <svg class="empty-state-icon" viewBox="0 0 48 48" fill="none" aria-hidden="true">
            <circle cx="24" cy="24" r="20" stroke="currentColor" stroke-width="1.6"/>
            <path d="M16 24.5l5.5 5.5L33 18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <p id="emptyStateTitle" class="empty-state-title">You're all caught up.</p>
          <p id="emptyStateSubtitle" class="empty-state-subtitle">Add a task to get started.</p>
        </div>
      </section>

      <!-- ===== Footer / Counter ===== -->
      <footer class="task-footer">
        <p id="taskCounter" class="task-counter">0 tasks remaining</p>
        <div class="task-footer-end">
          <span id="completedCounter" class="completed-counter">0 completed</span>
          <button type="button" id="clearCompletedBtn" class="btn btn-ghost" hidden>Clear completed</button>
        </div>
      </footer>

    </div>
  </main>

  <!-- ===== Toast (used for undo delete / undo clear completed) ===== -->
  <div id="toast" class="toast" role="status" aria-live="polite" hidden>
    <span id="toastMessage" class="toast-message"></span>
    <button type="button" id="toastUndoBtn" class="toast-undo-btn" hidden>Undo</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
